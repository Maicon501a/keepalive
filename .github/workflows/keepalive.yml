name: keepalive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping proxy
        run: curl -fsS --max-time 60 "https://deepseek-proxy-jsop.onrender.com/v1/models" -o /dev/null -w "HTTP %{http_code}\n"

      - uses: actions/checkout@v4

      - name: Heartbeat commit (impede o GitHub de pausar o schedule)
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > LAST_PING.txt
          git config user.name "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git add LAST_PING.txt
          git commit -m "heartbeat $(date -u +%Y-%m-%dT%H:%M)" || echo "nothing to commit"
          git push
